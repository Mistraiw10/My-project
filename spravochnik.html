<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Справочник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar (back to hub + title + section tabs), below it the chosen game's reference shown in a full-height frame */
:root{
  --bg:#E9EEF0; --surface:#FFFFFF; --surface2:#F2F5F6; --ink:#15232B; --muted:#5A6B74; --line:#D3DCE0; --steel:#2F5566;
  --c-aro:#5B3FD1; --c-ene:#E2621B; --c-yne:#1F8A9E; --c-diene:#B3367A;
  --f-display:"Russo One","Arial Black",sans-serif; --f-body:"Golos Text","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10181D; --surface:#1A252C; --surface2:#213039; --ink:#E5EDF0; --muted:#9AAEB7; --line:#2E3F48; --steel:#8FB6C7;
  --c-aro:#A08CFF; --c-ene:#FF8A47; --c-yne:#4FC3D6; --c-diene:#F07AB8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10181D; --surface:#1A252C; --surface2:#213039; --ink:#E5EDF0; --muted:#9AAEB7; --line:#2E3F48; --steel:#8FB6C7;
  --c-aro:#A08CFF; --c-ene:#FF8A47; --c-yne:#4FC3D6; --c-diene:#F07AB8; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.bar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left,0px)) 0;display:flex;flex-direction:column;gap:10px}
.in{max-width:980px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;background:var(--surface2);border-radius:999px;padding:6px 14px}
.back:hover{color:var(--ink)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,5vw,28px);margin:0;line-height:1.1}
.note{color:var(--muted);font-size:13px;margin:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{--c:var(--steel);font:inherit;font-weight:700;font-size:14px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px 10px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--c);border-bottom-color:var(--c)}
.aro{--c:var(--c-aro)} .ene{--c:var(--c-ene)} .yne{--c:var(--c-yne)} .diene{--c:var(--c-diene)}
.frame{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<div class="bar">
  <div class="in">
    <div class="head">
      <a class="back" href="hub">← В хаб</a>
      <h1>Справочник</h1>
    </div>
    <p class="note">Нажми на карточку, чтобы открыть подробности.</p>
    <nav class="tabs" role="tablist" id="tabs" aria-label="Разделы справочника">
      <button class="tab aro" role="tab" type="button" data-g="aromadom">Аромадом · арены</button>
      <button class="tab ene" role="tab" type="button" data-g="alkeny">Алкены</button>
      <button class="tab yne" role="tab" type="button" data-g="alkiny">Алкины</button>
      <button class="tab diene" role="tab" type="button" data-g="alkadieny">Алкадиены</button>
    </nav>
  </div>
</div>
<div class="frame"><iframe id="fr" title="Раздел справочника"></iframe></div>

<script>
const tabs=[...document.querySelectorAll('[data-g]')];
function pick(g){
  if(!tabs.some(t=>t.dataset.g===g)) g=tabs[0].dataset.g;
  tabs.forEach(t=>t.setAttribute('aria-selected',String(t.dataset.g===g)));
  document.getElementById('fr').src=g+'.html?ref=1';
  if(location.hash!=='#'+g) history.replaceState(null,'','#'+g);
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-g]'); if(b) pick(b.dataset.g);});
window.addEventListener('hashchange',()=>pick(location.hash.slice(1)));
pick(location.hash.slice(1));
</script>
</body>
</html>
